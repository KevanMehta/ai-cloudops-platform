name: Documentation correction
description: Report inaccurate, unclear, or missing repository documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: File, section, or URL containing the problem.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is inaccurate or unclear and cite the implementation when relevant.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: Optional wording or structure that would resolve the issue.
