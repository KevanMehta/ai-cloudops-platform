services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cloudops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudops}:${POSTGRES_PASSWORD:-cloudops_secret}@postgres:5432/${POSTGRES_DB:-cloudops}
      REDIS_URL: redis://redis:6379/0
      OPERATING_MODE: ${OPERATING_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      INFRA_SAMPLES_PATH: /app/infra-samples
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_EXTERNAL_ID: ${AWS_EXTERNAL_ID:-}
      AWS_SESSION_NAME: ${AWS_SESSION_NAME:-cloudops-platform}
      AWS_COST_LOOKBACK_DAYS: ${AWS_COST_LOOKBACK_DAYS:-90}
      AWS_PROFILE: ${AWS_PROFILE:-}
      KUBERNETES_CONTEXT: ${KUBERNETES_CONTEXT:-}
    volumes:
      - ./infra-samples:/app/infra-samples:ro
      - ${AWS_CONFIG_DIR:-./.local/aws}:/home/app/.aws:ro
      - ${KUBECONFIG_PATH:-./.local/kube/config}:/home/app/.kube/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
